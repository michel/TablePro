name: Build Linux

on:
  push:
    branches: [main, linux, "linux/**", "feat/linux-**"]
    paths:
      - "linux/**"
      - ".github/workflows/build-linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/build-linux.yml"
  schedule:
    - cron: "13 14 * * 1"
  workflow_dispatch:

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'linux' || github.ref }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libssl-dev \
            libsecret-1-dev
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Unit tests
        run: cargo test --workspace --lib

  integration:
    name: Driver integration tests (docker)
    runs-on: ubuntu-24.04
    needs: fast
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'linux' || github.ref }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Verify docker is available
        run: docker version
      - name: Postgres integration tests
        run: cargo test --test integration -p tablepro-driver-postgres -- --include-ignored --test-threads=1
      - name: MySQL integration tests
        run: cargo test --test integration -p tablepro-driver-mysql -- --include-ignored --test-threads=1
