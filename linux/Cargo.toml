[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/storage",
    "crates/drivers/mysql",
    "crates/drivers/postgres",
    "crates/drivers/sqlite",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
async-channel = "2"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "chrono", "rust_decimal", "uuid", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5", "gtk_v4_6"] }
sourceview5 = { version = "0.11", features = ["v5_12"] }
glib = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_46"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
